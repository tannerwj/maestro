defaults:
  poll_interval: 30s
  max_concurrent_global: 5
  stall_timeout: 30m

agent_packs_dir: ../../agents

user:
  name: "Brandon Taylor"
  gitlab_username: "btaylor"

server:
  enabled: true
  host: 127.0.0.1
  port: 8742

sources:
  - name: fw-requests
    display_group: Firewall Requests
    tracker: gitlab
    label_prefix: fwr
    connection:
      base_url: https://git.taxhawk.com
      token_env: MAESTRO_TAXHAWK_GITLAB_TOKEN
      project: taxhawk/it/it-department/change-control/firewall-access
    filter:
      states: [opened]
    agent_type: fw-research
    poll_interval: 30s
    on_complete:
      add_labels: [fw:plan-posted]
    on_failure:
      add_labels: [fw:needs-attention]

  - name: fw-execute
    display_group: Firewall Execute
    tracker: gitlab
    label_prefix: fwx
    connection:
      base_url: https://git.taxhawk.com
      token_env: MAESTRO_TAXHAWK_GITLAB_TOKEN
      project: taxhawk/it/it-department/change-control/firewall-access
    filter:
      labels: [fw:plan-posted]
    agent_type: fw-execute
    poll_interval: 30s
    on_complete:
      remove_labels: [fw:plan-posted]
      add_labels: [fw:deployed]
    on_failure:
      remove_labels: [fw:plan-posted]
      add_labels: [fw:needs-attention]

  - name: fw-verify
    display_group: Firewall Verify
    tracker: gitlab
    label_prefix: fwv
    connection:
      base_url: https://git.taxhawk.com
      token_env: MAESTRO_TAXHAWK_GITLAB_TOKEN
      project: taxhawk/it/it-department/change-control/firewall-access
    filter:
      labels: [fw:deployed]
    agent_type: fw-verify
    poll_interval: 5m
    max_attempts: 1
    on_complete:
      remove_labels: [fw:deployed]
    on_failure:
      add_labels: [fw:needs-attention]

agent_types:
  - name: fw-research
    agent_pack: fw-research
    approval_policy: auto
    communication: slack-dm
    max_concurrent: 5

  - name: fw-execute
    agent_pack: fw-execute
    approval_policy: manual
    communication: slack-dm
    max_concurrent: 1

  - name: fw-verify
    agent_pack: fw-verify
    approval_policy: manual
    communication: slack-dm
    max_concurrent: 1

channels:
  - name: slack-dm
    kind: slack
    config:
      mode: dm
      token_env: MAESTRO_SLACK_BOT_TOKEN
      app_token_env: MAESTRO_SLACK_APP_TOKEN
      user_id_env: MAESTRO_SLACK_USER_ID

workspace:
  root: /Users/btaylor/.local/share/maestro/fw-requests/workspaces

state:
  dir: /Users/btaylor/.local/share/maestro/fw-requests/state
  retry_base: 15s
  max_retry_backoff: 5m
  max_attempts: 2

logging:
  level: info
  dir: /Users/btaylor/.local/share/maestro/fw-requests/logs
