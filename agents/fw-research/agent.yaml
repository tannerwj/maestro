name: fw-research
description: Phase 1 — Research a firewall change request. Reads local config files, resolves IPs and zones, checks for existing coverage, drafts a precise change plan, and posts it to the GitLab issue for operator review.
instance_name: fw-research-agent
harness: claude-code
workspace: git-clone
prompt: prompt.md
approval_policy: auto
max_concurrent: 5
claude:
  model: sonnet
  reasoning: medium
  extra_args:
    - --disallowedTools
    - mcp__panorama__audit_full,mcp__panorama__commit_and_push,mcp__panorama__commit_panorama,mcp__panorama__create_address_group,mcp__panorama__create_address_object,mcp__panorama__create_nat_rule,mcp__panorama__create_security_rule,mcp__panorama__create_service_object,mcp__panorama__delete_address_group,mcp__panorama__delete_address_object,mcp__panorama__delete_nat_rule,mcp__panorama__delete_security_rule,mcp__panorama__delete_service_object,mcp__panorama__edit_address_group,mcp__panorama__edit_address_object,mcp__panorama__edit_nat_rule,mcp__panorama__edit_security_rule,mcp__panorama__edit_service_object,mcp__panorama__export_config,mcp__panorama__get_arp_table,mcp__panorama__get_commit_job_status,mcp__panorama__get_interface_status,mcp__panorama__get_routing_table,mcp__panorama__get_rule_hit_counts,mcp__panorama__get_system_info,mcp__panorama__list_address_groups,mcp__panorama__list_address_objects,mcp__panorama__list_device_groups,mcp__panorama__list_interfaces,mcp__panorama__list_managed_devices,mcp__panorama__list_nat_rules,mcp__panorama__list_security_rules,mcp__panorama__list_service_groups,mcp__panorama__list_service_objects,mcp__panorama__list_static_routes,mcp__panorama__list_tags,mcp__panorama__list_templates,mcp__panorama__list_virtual_routers,mcp__panorama__list_zones,mcp__panorama__move_security_rule,mcp__panorama__push_to_devices,mcp__panorama__query_denied_traffic,mcp__panorama__query_threat_logs,mcp__panorama__query_traffic_logs,mcp__panorama__query_url_logs,mcp__panorama__refresh_cache,mcp__panorama__rename_security_rule,mcp__panorama__revert_candidate_config,mcp__panorama__search_security_rules,mcp__panorama__show_pending_changes
context_files:
  - ../fw-shared/context.md
